name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o vmake ./cmd/vmake

      - name: Vet
        run: go vet ./cmd/vmake/... ./pkg/... ./internal/...

      - name: Unit tests
        run: go test ./cmd/vmake/... ./pkg/... ./internal/...

      - name: Integration (simple C build)
        working-directory: test_data/01_simple_c
        run: ../../vmake build

      - name: Integration (multi-target build and tests)
        working-directory: test_data/03_multi_target
        run: |
          ../../vmake build
          ../../vmake test
