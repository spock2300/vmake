name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS runs build, vet, and the integration fixtures. Its unit suite
          # still has platform-specific path/tool expectations (/private/var
          # temp roots, BSD ar/size, Apple GNU make 3.81) that are tracked for a
          # follow-up; the full unit suite runs on Linux.
          - os: ubuntu-latest
            unit: true
          - os: macos-latest
            unit: false
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o vmake ./cmd/vmake

      - name: Vet
        run: go vet ./cmd/vmake/... ./pkg/... ./internal/...

      - name: Unit tests
        if: matrix.unit
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          go test ./cmd/vmake/... ./pkg/... ./internal/... 2>&1 | tee "$RUNNER_TEMP/go-test.log"

      - name: Report unit test failures
        if: matrix.unit && steps.unit.outcome == 'failure'
        run: |
          awk '
            /^--- FAIL/ { show = 4 }
            show > 0 { print "::error::" $0; show--; next }
            /^(FAIL|panic:|internal compiler error)/ { print "::error::" $0 }
          ' "$RUNNER_TEMP/go-test.log" | head -100
          exit 1

      - name: Integration (simple C build)
        working-directory: test_data/01_simple_c
        run: ../../vmake build

      - name: Integration (multi-target build and tests)
        working-directory: test_data/03_multi_target
        run: |
          ../../vmake build
          ../../vmake test
